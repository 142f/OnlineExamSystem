# Docker 环境专用配置（通过 --spring.profiles.active=docker 激活）
# 所有可变量均支持环境变量覆盖，便于 docker-compose / K8s 注入。

server.port=9201
# 会话有效期：60 分钟
server.servlet.session.timeout=60m

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.url=${DB_URL:jdbc:mysql://db:3306/online_exam?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}

mybatis.configuration.mapUnderscoreToCamelCase=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
logging.level.com.rabbiter.oes.mapper=info

# 允许访问后端的前端来源（容器内前端经 nginx 同源代理，一般无需跨域）
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:9202,http://127.0.0.1:9202,http://localhost}
